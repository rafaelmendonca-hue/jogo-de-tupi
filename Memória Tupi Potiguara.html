<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memória Tupi Potiguara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================
   DESIGN SYSTEM — variáveis (tema claro padrão + escuro)
   ===================================================== */
:root{
  --forest-900:#1b4332; --forest-700:#2d6a4f;
  --clay-700:#8b5e34;   --clay-500:#bc6c25;
  --straw-400:#dda15e;  --straw-300:#f4a261;
  --bg-from:#fdfbf7; --bg-to:#e8efe3;
  --ink:#1f2d24; --muted:#5c6b5f;
  --glass:rgba(255,255,255,.55); --glass-border:rgba(45,106,79,.25);
  --shadow:0 8px 28px rgba(27,67,50,.18);
  --font-ui:"Poppins","Inter","Segoe UI",system-ui,sans-serif;
  --font-title:"Cinzel","Georgia","Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-from:#0f281e; --bg-to:#1b4332; --ink:#f4efe2; --muted:#a9bdaf;
    --glass:rgba(255,255,255,.08); --glass-border:rgba(221,161,94,.3);
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg-from:#0f281e; --bg-to:#1b4332; --ink:#f4efe2; --muted:#a9bdaf;
  --glass:rgba(255,255,255,.08); --glass-border:rgba(221,161,94,.3);
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--font-ui);
  background:linear-gradient(160deg,var(--bg-from),var(--bg-to)) fixed;
}
.container{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.hidden{display:none!important}

/* Cabeçalho e grafismo decorativo */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-title);font-weight:800;margin:0;font-size:clamp(1.4rem,4.5vw,2.3rem);letter-spacing:.04em;
  background:linear-gradient(90deg,var(--forest-700),var(--clay-500));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{background:linear-gradient(90deg,var(--straw-400),var(--straw-300));-webkit-background-clip:text;background-clip:text}}
:root[data-theme="dark"] h1{background:linear-gradient(90deg,var(--straw-400),var(--straw-300));-webkit-background-clip:text;background-clip:text}
.band{height:8px;border-radius:4px;margin:12px 0 20px;
  background:repeating-linear-gradient(90deg,var(--clay-700) 0 16px,var(--straw-400) 16px 32px,var(--forest-700) 32px 48px)}
.sub{color:var(--muted);margin:0 0 16px}

/* Glassmorphism reutilizável */
.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}

/* Botões */
.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;color:#fff;
  background:linear-gradient(135deg,var(--forest-700),var(--forest-900));transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(27,67,50,.35)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--forest-700)}
.btn.icon{padding:8px 12px}
/* Call to Action com gradiente e pulso */
.cta{display:block;margin:22px auto 0;font-size:1.1rem;padding:14px 32px;border-radius:999px;
  background:linear-gradient(135deg,var(--clay-500),var(--straw-300));color:#2b1a08;
  animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,162,97,.6)}70%{box-shadow:0 0 0 16px rgba(244,162,97,0)}100%{box-shadow:0 0 0 0 rgba(244,162,97,0)}}

/* =====================  FASE 1 — VOCABULÁRIO  ===================== */
.search{width:100%;padding:13px 16px;font:inherit;border-radius:12px;color:var(--ink);
  background:var(--glass);border:1px solid var(--glass-border);outline:none}
.search:focus{border-color:var(--straw-400);box-shadow:0 0 0 3px rgba(221,161,94,.35)}
.count{color:var(--muted);font-size:.85rem;margin:8px 2px 12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.word{padding:14px;transition:transform .2s,box-shadow .2s;border-left:5px solid var(--clay-500)}
.word:hover{transform:translateY(-4px)}
.word b{display:block;font-family:var(--font-title);font-size:1.15rem;color:var(--forest-700)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .word b{color:var(--straw-400)}}
:root[data-theme="dark"] .word b{color:var(--straw-400)}
.word span{color:var(--muted);font-size:.92rem}
.empty{text-align:center;color:var(--muted);padding:30px}

/* =====================  FASE 2 — JOGO  ===================== */
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lvl{flex:1 1 120px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;padding:9px 10px;border-radius:12px;
  color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);transition:transform .2s}
.lvl:hover{transform:translateY(-2px)}
.lvl[aria-pressed="true"]{background:linear-gradient(135deg,var(--forest-700),var(--forest-900));color:#fff;border-color:transparent}
.lvl small{display:block;font-weight:400;opacity:.8}
.hud{display:flex;flex-wrap:wrap;gap:10px;padding:12px;margin-bottom:12px;align-items:stretch}
.stat{flex:1 1 90px;text-align:center}
.stat small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.hud .nav{display:flex;gap:8px;flex:2 1 260px}
.hud .nav .btn{flex:1;font-size:.85rem}
.feedback{min-height:42px;text-align:center;padding:9px;margin-bottom:12px;font-weight:600;color:var(--muted);transition:color .3s}
.feedback.ok{color:var(--forest-700)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .feedback.ok{color:var(--straw-300)}}
:root[data-theme="dark"] .feedback.ok{color:var(--straw-300)}

.board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(var(--cw,92px),1fr))}
.board[data-size="m"]{--cw:80px}.board[data-size="l"]{--cw:70px}.board[data-size="xl"]{--cw:62px}
.card{perspective:800px;aspect-ratio:3/4;background:none;border:0;padding:0;cursor:pointer;font:inherit;transition:transform .2s}
.card:not(.flipped):not(.matched):hover{transform:translateY(-4px)}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px;text-align:center;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.2);overflow:hidden}
.back{background:
  repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.14) 8px 10px),
  linear-gradient(135deg,var(--clay-700),var(--clay-500));border:2px solid var(--straw-400)}
.back::after{content:"◆";color:var(--straw-400);font-size:1.3rem}
.front{transform:rotateY(180deg);font-weight:600;font-size:clamp(.66rem,2.5vw,.95rem);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.front i{font-style:normal;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.board[data-size="l"] .front,.board[data-size="xl"] .front{font-size:clamp(.58rem,2.1vw,.78rem)}
.card.tupi .front{background:linear-gradient(135deg,var(--forest-700),var(--forest-900));color:#f4efe2;border:2px solid var(--straw-400)}
.card.pt .front{background:linear-gradient(135deg,var(--straw-400),var(--straw-300));color:#2b1a08;border:2px solid var(--forest-700)}
/* Brilho ao acertar e tremor ao errar */
.card.matched .face{animation:glow 1s ease-out}
.card.matched{cursor:default}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(244,162,97,.9)}50%{box-shadow:0 0 22px 8px rgba(244,162,97,.8)}100%{box-shadow:0 3px 10px rgba(0,0,0,.2)}}
.card.shake .inner{animation:shake .4s}
@keyframes shake{20%{transform:rotateY(180deg) translateX(-6px)}60%{transform:rotateY(180deg) translateX(6px)}100%{transform:rotateY(180deg)}}

/* =====================  FASE 3 — MODAL  ===================== */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(10,25,18,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal{max-width:430px;width:100%;padding:26px;text-align:center;background:var(--bg-from);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:var(--font-title);margin:0 0 6px;font-size:1.6rem}
.modal .row{display:flex;gap:10px;margin:16px 0}
.modal .row .stat{flex:1;padding:10px;border-radius:12px;background:var(--glass)}
.modal .msg{color:var(--muted);margin:0 0 16px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px}.modal .actions .btn{flex:1 1 140px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <h1>Memória Tupi Potiguara</h1>
    <button class="btn ghost icon" id="theme" aria-label="Alternar tema claro/escuro">◐</button>
  </header>
  <div class="band"></div>

  <!-- FASE 1: Estudo de vocabulário -->
  <main id="study">
    <p class="sub">Estude as 60 palavras antes de jogar. Busque por Tupi ou por Português.</p>
    <input class="search" id="search" type="search" placeholder="Buscar palavra…" aria-label="Buscar no vocabulário" autocomplete="off">
    <div class="count" id="count"></div>
    <div class="vocab" id="vocab"></div>
    <button class="btn cta" id="start">Iniciar Jogo da Memória</button>
  </main>

  <!-- FASE 2: Jogo -->
  <section id="game" class="hidden">
    <div class="levels" id="levels">
      <button class="lvl" data-p="8"  aria-pressed="true">Fácil<small>8 pares · 16 cartas</small></button>
      <button class="lvl" data-p="15" aria-pressed="false">Médio<small>15 pares · 30 cartas</small></button>
      <button class="lvl" data-p="25" aria-pressed="false">Difícil<small>25 pares · 50 cartas</small></button>
      <button class="lvl" data-p="60" aria-pressed="false">Modo Completo<small>60 pares · 120 cartas</small></button>
    </div>
    <div class="hud glass">
      <div class="stat"><small>Tempo</small><b id="time">00:00</b></div>
      <div class="stat"><small>Movimentos</small><b id="moves">0</b></div>
      <div class="stat"><small>Pares</small><b id="pairs">0/0</b></div>
      <div class="nav">
        <button class="btn" id="restart">Reiniciar Partida</button>
        <button class="btn ghost" id="back">Voltar ao Vocabulário</button>
      </div>
    </div>
    <div class="feedback glass" id="feedback" role="status" aria-live="polite">Vire duas cartas para começar.</div>
    <div class="board" id="board"></div>
  </section>
</div>

<!-- FASE 3: Modal de vitória -->
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="wt">
  <div class="modal glass">
    <h2 id="wt">Parabéns! 🌿</h2>
    <div class="row">
      <div class="stat"><small>Tempo total</small><b id="wTime">00:00</b></div>
      <div class="stat"><small>Movimentos</small><b id="wMoves">0</b></div>
    </div>
    <p class="msg" id="wMsg"></p>
    <div class="actions">
      <button class="btn" id="again">Jogar Novamente</button>
      <button class="btn ghost" id="review">Revisar Vocabulário</button>
    </div>
  </div>
</div>

<script>
/* ================= Banco de dados ================= */
const vocabulario = [
  { tupi: "Abá", portugues: "Pessoa, indígena" },
  { tupi: "Akanga", portugues: "Cabeça" },
  { tupi: "Amana", portugues: "Chuva" },
  { tupi: "Anama", portugues: "Povo, família, parentes" },
  { tupi: "Apyaba", portugues: "Homem" },
  { tupi: "Arara", portugues: "Arara" },
  { tupi: "Arasá", portugues: "Araçá (fruta)" },
  { tupi: "Atã", portugues: "Duro, forte, rijo" },
  { tupi: "Ausub", portugues: "Amar" },
  { tupi: "Baiaku", portugues: "Baiacu" },
  { tupi: "Bebé", portugues: "Voar" },
  { tupi: "Berab", portugues: "Brilhar" },
  { tupi: "Eíra", portugues: "Abelha, mel" },
  { tupi: "Guará", portugues: "Garça" },
  { tupi: "Guaráguá", portugues: "Peixe-boi" },
  { tupi: "Guaratá / Guatá", portugues: "Caminhar, andar" },
  { tupi: "Gûyrá", portugues: "Pássaro, ave" },
  { tupi: "Iaguara", portugues: "Onça, cachorro" },
  { tupi: "Iakaré", portugues: "Jacaré" },
  { tupi: "Iasy", portugues: "Lua, mês" },
  { tupi: "Iasy-tatá", portugues: "Estrela" },
  { tupi: "Ikobé", portugues: "Viver" },
  { tupi: "Itá", portugues: "Pedra, metal" },
  { tupi: "Iuka", portugues: "Matar" },
  { tupi: "Ka’a", portugues: "Mata, floresta" },
  { tupi: "Karu", portugues: "Comer" },
  { tupi: "Kuarasy", portugues: "Sol" },
  { tupi: "Kunhã", portugues: "Mulher, fêmea" },
  { tupi: "Kunumĩ", portugues: "Menino" },
  { tupi: "Makaxera", portugues: "Macaxeira" },
  { tupi: "Manõ", portugues: "Morrer" },
  { tupi: "Mboia", portugues: "Cobra" },
  { tupi: "Morombo'esara", portugues: "Professor, ensinador" },
  { tupi: "Naná", portugues: "Abacaxi" },
  { tupi: "Nhe'eng", portugues: "Falar, emitir som" },
  { tupi: "Oka", portugues: "Oca, casa" },
  { tupi: "Pirá", portugues: "Peixe" },
  { tupi: "Poti", portugues: "Camarão" },
  { tupi: "Y", portugues: "Água, rio" },
  { tupi: "Abaetaba", portugues: "Aldeia de homens respeitáveis" },
  { tupi: "Aíb", portugues: "Mau, ruim" },
  { tupi: "Ajuru", portugues: "Papagaio" },
  { tupi: "Akyry", portugues: "Dormir" },
  { tupi: "Apyka", portugues: "Assento, banco" },
  { tupi: "Ara", portugues: "Dia, tempo" },
  { tupi: "Ceĩ", portugues: "Sair" },
  { tupi: "Ete", portugues: "Verdadeiro, bom, ilustre" },
  { tupi: "Ieroky", portugues: "Dançar" },
  { tupi: "Iuká", portugues: "Quebrar, bater" },
  { tupi: "Kîaba", portugues: "Rede de dormir" },
  { tupi: "Kûá", portugues: "Cintura" },
  { tupi: "Mba’e", portugues: "Coisa" },
  { tupi: "Moingobé", portugues: "Fazer viver, ressuscitar" },
  { tupi: "Pĩa", portugues: "Coração" },
  { tupi: "Pytuna", portugues: "Noite" },
  { tupi: "Tapyĩ", portugues: "Cabana, habitação indígena" },
  { tupi: "Tuba", portugues: "Pai" },
  { tupi: "Tãîa", portugues: "Dente" },
  { tupi: "Sy", portugues: "Mãe" }
];

const $ = id => document.getElementById(id);
const board = $("board"), feedback = $("feedback");

/* ================= Utilitários ================= */
function shuffle(a){ a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
// Remove acentos e caixa para a busca ser tolerante (ex.: "aba" encontra "Abá")
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

/* ================= Navegação entre fases ================= */
function show(view){
  ["study","game"].forEach(v=>$(v).classList.toggle("hidden",v!==view));
  $("overlay").classList.add("hidden");
  if(view==="study") stopTimer();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ================= FASE 1: vocabulário + busca ================= */
function renderVocab(q=""){
  const t = norm(q.trim());
  const list = vocabulario.filter(w=>norm(w.tupi).includes(t)||norm(w.portugues).includes(t));
  $("count").textContent = list.length+" de "+vocabulario.length+" palavras";
  const frag = document.createDocumentFragment();
  list.forEach(w=>{
    const d = document.createElement("div"); d.className="word glass";
    const b = document.createElement("b"); b.textContent = w.tupi;
    const s = document.createElement("span"); s.textContent = w.portugues;
    d.append(b,s); frag.append(d);
  });
  if(!list.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="Nenhuma palavra encontrada."; frag.append(e); }
  $("vocab").replaceChildren(frag);
}
$("search").addEventListener("input",e=>renderVocab(e.target.value));

/* ================= FASE 2: estado e lógica do jogo ================= */
let pairsCount = 8, first=null, second=null, lock=false, moves=0, found=0, seconds=0, timer=null;

function startTimer(){ if(timer) return; timer=setInterval(()=>{seconds++;$("time").textContent=fmt(seconds);},1000); }
function stopTimer(){ clearInterval(timer); timer=null; }
function say(t,ok=false){ feedback.textContent=t; feedback.classList.toggle("ok",ok); }

function makeCard(id,text,type){
  const c = document.createElement("button");
  c.type="button"; c.className="card "+type; c.dataset.pair=id;
  c.setAttribute("aria-label","Carta virada para baixo");
  c.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"><i></i><span></span></div></div>';
  c.querySelector("i").textContent = type==="tupi" ? "Tupi" : "Português";
  c.querySelector("span").textContent = text;
  c.addEventListener("click",()=>flip(c));
  return c;
}

function newGame(n){
  if(n) pairsCount=n;
  stopTimer(); first=second=null; lock=false; moves=0; found=0; seconds=0;
  $("moves").textContent="0"; $("time").textContent="00:00"; $("pairs").textContent="0/"+pairsCount;
  say("Vire duas cartas para começar.");
  $("overlay").classList.add("hidden");
  document.querySelectorAll(".lvl").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.p===pairsCount)));
  // Sorteio aleatório dos pares a cada partida
  const cards=[];
  shuffle(vocabulario).slice(0,pairsCount).forEach((w,i)=>{
    cards.push(makeCard(i,w.tupi,"tupi"), makeCard(i,w.portugues,"pt"));
  });
  board.dataset.size = pairsCount<=8?"s":pairsCount<=15?"m":pairsCount<=25?"l":"xl";
  board.replaceChildren(...shuffle(cards));
}

function flip(c){
  if(lock||c===first||c.classList.contains("matched")) return;
  startTimer();
  c.classList.add("flipped");
  c.setAttribute("aria-label",c.querySelector(".front span").textContent);
  if(!first){ first=c; return; }
  second=c; lock=true; moves++; $("moves").textContent=moves;
  first.dataset.pair===second.dataset.pair ? hit() : miss();
}

function hit(){
  const t = first.classList.contains("tupi")?first:second, p = t===first?second:first;
  say("✔ "+t.querySelector(".front span").textContent+" = "+p.querySelector(".front span").textContent,true);
  [first,second].forEach(c=>{c.classList.remove("flipped");c.classList.add("matched");});
  found++; $("pairs").textContent=found+"/"+pairsCount;
  first=second=null; lock=false;
  if(found===pairsCount) setTimeout(win,900);
}

function miss(){
  const a=first,b=second; say("Não é um par. Tente de novo!");
  setTimeout(()=>{
    [a,b].forEach(c=>{c.classList.add("shake");c.classList.remove("flipped");c.setAttribute("aria-label","Carta virada para baixo");});
    setTimeout(()=>[a,b].forEach(c=>c.classList.remove("shake")),450);
    first=second=null; lock=false;
  },900);
}

/* ================= FASE 3: vitória ================= */
function win(){
  stopTimer();
  $("wTime").textContent=fmt(seconds); $("wMoves").textContent=moves;
  // Mensagem conforme a eficiência (movimentos perfeitos = nº de pares)
  const r = moves/pairsCount;
  $("wMsg").textContent = r<=1.6 ? "Memória de pajé! Você domina estas palavras."
    : r<=2.6 ? "Muito bem! Continue praticando e logo falará Tupi com fluência."
    : "Cada partida fortalece sua memória e a língua dos ancestrais. Jogue de novo!";
  $("overlay").classList.remove("hidden");
}

/* ================= Eventos ================= */
$("start").addEventListener("click",()=>{ show("game"); newGame(); });
$("restart").addEventListener("click",()=>newGame());
$("back").addEventListener("click",()=>show("study"));
$("again").addEventListener("click",()=>newGame());
$("review").addEventListener("click",()=>show("study"));
$("levels").addEventListener("click",e=>{ const b=e.target.closest(".lvl"); if(b) newGame(+b.dataset.p); });
// Alternância manual de tema (sobrepõe a preferência do sistema)
$("theme").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});

renderVocab();
</script>
</body>
